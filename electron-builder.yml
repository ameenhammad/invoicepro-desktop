appId: com.invoicepro.app
productName: InvoicePro
copyright: Copyright © 2024 InvoicePro

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json

asar: true
# better-sqlite3's compiled .node addon can't be dlopen'd from inside the
# asar archive — Node/Electron can transparently read regular files out of
# an asar, but not mmap a native binary out of it. Without this, the
# packaged app fails at startup the first time it opens the database.
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.business
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - target: AppImage
  icon: build/icon.png
  category: Office
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
